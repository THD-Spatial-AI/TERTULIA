# Drop this file at /etc/nginx/sites-available/feedback on the university VM.
# Then:
#   sudo ln -s /etc/nginx/sites-available/feedback /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d feedback-api.th-deg.de
#   sudo systemctl reload nginx
#
# Replace feedback-api.th-deg.de with your actual subdomain.

server {
    listen 80;
    server_name feedback-api.th-deg.de;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
# Certbot will append an HTTPS server block automatically after running.
