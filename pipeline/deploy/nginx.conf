# Reverse proxy in front of the FastAPI backend, run as a container by
# docker-compose.prod.yml. Mounted read-only at /etc/nginx/conf.d/default.conf.
#
# This replaces the host-installed nginx that pipeline/backend/deploy_vm.sh
# sets up. The upstream is the compose service name on its INTERNAL port 8000 —
# not the published 9000, which only exists on the host.

server {
    listen 80;
    server_name _;

    # The overlay posts a base64 JPEG screenshot inside the JSON body
    # (pipeline/overlay/src/FeedbackOverlay.tsx). nginx defaults to 1m, which
    # rejects most captures with a 413 before the app ever sees them.
    client_max_body_size 25m;

    # Docker's embedded DNS. Without a resolver, nginx resolves the upstream
    # once at startup and keeps serving 502s if the backend container is
    # recreated with a new IP.
    resolver 127.0.0.11 valid=30s ipv6=off;

    location / {
        # Held in a variable so the resolver above is actually consulted;
        # a literal proxy_pass host is cached for the life of the process.
        # No URI part means the original request URI is passed through as-is.
        set $backend http://feedback-pipeline:8000;
        proxy_pass $backend;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A cold 14B model can take well over nginx's 60s default to answer.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}
