services:

  postgres:
    image: postgres:16-alpine
    container_name: tertulia-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-tertulia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tertulia}
      POSTGRES_DB:       ${POSTGRES_DB:-tertulia}
    volumes:
      - tertulia-postgres-data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tertulia}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tertulia

  redis:
    image: redis:7-alpine
    container_name: tertulia-redis
    restart: unless-stopped
    networks:
      - tertulia

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: tertulia-keycloak
    restart: unless-stopped
    ports:
      - "${KEYCLOAK_PORT:-8185}:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB:            postgres
      KC_DB_URL:        jdbc:postgresql://postgres:5432/${POSTGRES_DB:-tertulia}
      KC_DB_USERNAME:   ${POSTGRES_USER:-tertulia}
      KC_DB_PASSWORD:   ${POSTGRES_PASSWORD:-tertulia}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME:      ${KC_HOSTNAME:-localhost}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED:  "true"
    command: start-dev
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/8080' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - tertulia

  auth-service:
    build:
      context: ${STORCITO_REPO_PATH:-../storcito}
      dockerfile: platform-core/auth-service/Dockerfile
    image: tertulia-auth-service:latest
    container_name: tertulia-auth-service
    restart: unless-stopped
    ports:
      - "${AUTH_PORT:-8002}:8001"
    environment:
      APP_ENV:            development
      APP_HOST:           0.0.0.0
      APP_PORT:           "8001"
      KEYCLOAK_URL:       http://keycloak:8080
      KEYCLOAK_REALM:     ${AUTH_REALM:-tertulia}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-tertulia-auth}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?KEYCLOAK_CLIENT_SECRET is required}
      FRONTEND_URL:       ${FRONTEND_URL:-http://localhost:8080}
      AUTH_INTERNAL_SECRET: ${AUTH_INTERNAL_SECRET:?AUTH_INTERNAL_SECRET is required}
      REDIS_HOST:         redis
      REDIS_PORT:         "6379"
      REDIS_PASSWORD:     ${REDIS_PASSWORD:-}
      DB_HOST:            postgres
      DB_PORT:            "5432"
      DB_DATABASE:        ${POSTGRES_DB:-tertulia}
      DB_USERNAME:        ${POSTGRES_USER:-tertulia}
      DB_PASSWORD:        ${POSTGRES_PASSWORD:-tertulia}
      SESSION_TTL_MINUTES: "60"
    depends_on:
      keycloak:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - tertulia

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tertulia-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8010}:8001"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL:         postgresql://${POSTGRES_USER:-tertulia}:${POSTGRES_PASSWORD:-tertulia}@postgres:5432/${POSTGRES_DB:-tertulia}
      AUTH_SERVICE_URL:     http://auth-service:8001
      AUTH_REALM:           ${AUTH_REALM:-tertulia}
      AUTH_INTERNAL_SECRET: ${AUTH_INTERNAL_SECRET:?AUTH_INTERNAL_SECRET is required}
      LOG_LEVEL:            ${LOG_LEVEL:-INFO}
      # ── feedback pipeline handoff ──────────────────────────────────────────
      # Reach the pipeline by its compose service name on the shared network,
      # NOT the host-published port. PIPELINE_TOKEN is the single source of
      # truth for the workshop token (== the pipeline's WORKSHOP_TOKEN == the
      # overlay's workshopToken).
      PIPELINE_API_URL:     http://feedback-pipeline:8000
      PIPELINE_TOKEN:       ${PIPELINE_TOKEN:?PIPELINE_TOKEN is required}
      WILDFIRE_BASE_URL:    ${WILDFIRE_BASE_URL:-https://wildfire.thd-spatial-ai.de}
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - tertulia

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_AUTH_SERVICE_URL: ${VITE_AUTH_SERVICE_URL:-http://localhost:8002}
        VITE_AUTH_REALM:       ${AUTH_REALM:-tertulia}
        VITE_DEFAULT_LANG:     ${VITE_DEFAULT_LANG:-en}
    container_name: tertulia-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - tertulia

  # ── Feedback pipeline (was feeedback_pipeline/) ─────────────────────────────
  # Local Ollama + n8n is the canonical, fully self-hosted inference path.
  # On a machine without an NVIDIA GPU, layer the CPU override:
  #   docker compose -f docker-compose.yml -f docker-compose.cpu.yml up -d
  ollama:
    image: ollama/ollama
    container_name: tertulia-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - tertulia-ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - tertulia

  n8n:
    image: n8nio/n8n
    container_name: tertulia-n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      N8N_HOST:     ${N8N_HOST:-localhost}
      N8N_PORT:     "5678"
      N8N_PROTOCOL: http
      WEBHOOK_URL:  ${N8N_WEBHOOK_URL:-http://localhost:5678}
      # Per-machine key (git-ignored). `make env` generates one. A shared key
      # lets anyone decrypt n8n credentials, so compose fails fast if unset.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY is not set — run `make env` or set it in .env}
    volumes:
      - tertulia-n8n-data:/home/node/.n8n
    depends_on:
      - ollama
    networks:
      - tertulia

  feedback-pipeline:
    build:
      context: ./pipeline/backend
      dockerfile: Dockerfile
    image: tertulia-feedback-pipeline:latest
    container_name: tertulia-feedback-pipeline
    restart: unless-stopped
    ports:
      - "${PIPELINE_PORT:-9000}:8000"
    environment:
      # Canonical path is local Ollama via the n8n webhooks below. GROQ_API_KEY
      # is an OPTIONAL cloud accelerator — leave it empty to stay self-hosted.
      GROQ_API_KEY:            ${GROQ_API_KEY:-}
      N8N_VISION_WEBHOOK_URL:  http://n8n:5678/webhook/vision
      N8N_PROCESS_WEBHOOK_URL: http://n8n:5678/webhook/process
      # WORKSHOP_TOKEN == PIPELINE_TOKEN (tertulia) == overlay workshopToken.
      WORKSHOP_TOKEN:          ${PIPELINE_TOKEN:?PIPELINE_TOKEN is required}
      GITHUB_TOKEN:            ${GITHUB_TOKEN:-}
      GITHUB_REPO:             ${GITHUB_REPO:-THD-Spatial-AI/Storcito-Wildfire}
      ALLOWED_ORIGINS:         ${PIPELINE_ALLOWED_ORIGINS:-https://wildfire-app.th-deg.de}
      # Target app under test — drives the AI prompts (defaults keep Wildfire).
      TARGET_APP_NAME:         ${TARGET_APP_NAME:-Wildfire App}
      TARGET_APP_DESCRIPTION:  ${TARGET_APP_DESCRIPTION:-a geospatial wildfire risk simulation platform used by municipalities, firefighters, mayors, and emergency management professionals}
    depends_on:
      - n8n
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').getcode()==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - tertulia

volumes:
  tertulia-postgres-data:
  tertulia-ollama-data:
  tertulia-n8n-data:

networks:
  tertulia:
    driver: bridge
