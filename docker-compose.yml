services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tertulia-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8010}:8001"
    env_file:
      - ./backend/.env
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - tertulia

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://backend:8001}
        VITE_DEFAULT_LANG: ${VITE_DEFAULT_LANG:-en}
    container_name: tertulia-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - tertulia

networks:
  tertulia:
    driver: bridge
