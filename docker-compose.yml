services:

  postgres:
    image: postgres:16-alpine
    container_name: tertulia-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-tertulia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tertulia}
      POSTGRES_DB:       ${POSTGRES_DB:-tertulia}
    volumes:
      - tertulia-postgres-data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tertulia}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tertulia

  redis:
    image: redis:7-alpine
    container_name: tertulia-redis
    restart: unless-stopped
    networks:
      - tertulia

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: tertulia-keycloak
    restart: unless-stopped
    ports:
      - "${KEYCLOAK_PORT:-8185}:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB:            postgres
      KC_DB_URL:        jdbc:postgresql://postgres:5432/${POSTGRES_DB:-tertulia}
      KC_DB_USERNAME:   ${POSTGRES_USER:-tertulia}
      KC_DB_PASSWORD:   ${POSTGRES_PASSWORD:-tertulia}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME:      ${KC_HOSTNAME:-localhost}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED:  "true"
    command: start-dev
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/8080' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - tertulia

  auth-service:
    build:
      context: ${STORCITO_REPO_PATH:-../storcito}
      dockerfile: platform-core/auth-service/Dockerfile
    image: tertulia-auth-service:latest
    container_name: tertulia-auth-service
    restart: unless-stopped
    ports:
      - "${AUTH_PORT:-8002}:8001"
    environment:
      APP_ENV:            development
      APP_HOST:           0.0.0.0
      APP_PORT:           "8001"
      KEYCLOAK_URL:       http://keycloak:8080
      KEYCLOAK_REALM:     ${AUTH_REALM:-tertulia}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-tertulia-auth}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?KEYCLOAK_CLIENT_SECRET is required}
      FRONTEND_URL:       ${FRONTEND_URL:-http://localhost:8080}
      AUTH_INTERNAL_SECRET: ${AUTH_INTERNAL_SECRET:?AUTH_INTERNAL_SECRET is required}
      REDIS_HOST:         redis
      REDIS_PORT:         "6379"
      REDIS_PASSWORD:     ${REDIS_PASSWORD:-}
      DB_HOST:            postgres
      DB_PORT:            "5432"
      DB_DATABASE:        ${POSTGRES_DB:-tertulia}
      DB_USERNAME:        ${POSTGRES_USER:-tertulia}
      DB_PASSWORD:        ${POSTGRES_PASSWORD:-tertulia}
      SESSION_TTL_MINUTES: "60"
    depends_on:
      keycloak:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - tertulia

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tertulia-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8010}:8001"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL:         postgresql://${POSTGRES_USER:-tertulia}:${POSTGRES_PASSWORD:-tertulia}@postgres:5432/${POSTGRES_DB:-tertulia}
      AUTH_SERVICE_URL:     http://auth-service:8001
      AUTH_REALM:           ${AUTH_REALM:-tertulia}
      AUTH_INTERNAL_SECRET: ${AUTH_INTERNAL_SECRET:?AUTH_INTERNAL_SECRET is required}
      LOG_LEVEL:            ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - tertulia

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_AUTH_SERVICE_URL: ${VITE_AUTH_SERVICE_URL:-http://localhost:8002}
        VITE_AUTH_REALM:       ${AUTH_REALM:-tertulia}
        VITE_DEFAULT_LANG:     ${VITE_DEFAULT_LANG:-en}
    container_name: tertulia-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - tertulia

volumes:
  tertulia-postgres-data:

networks:
  tertulia:
    driver: bridge
