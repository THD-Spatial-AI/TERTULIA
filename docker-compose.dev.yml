# Development overrides — mounts source for live reload.
# Usage (via Makefile):  make dev-docker
# Direct usage:          docker compose -f docker-compose.yml -f docker-compose.dev.yml up backend frontend-dev

services:

  # Override production backend: add source mount and enable hot-reload
  backend:
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    environment:
      - LOG_LEVEL=DEBUG
      - ENABLE_DOCS=true

  # Standalone Vite dev server (replaces the nginx frontend in dev mode)
  frontend-dev:
    image: node:20-alpine
    container_name: tertulia-frontend-dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env.local
    environment:
      - VITE_BACKEND_URL=http://backend:8001
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - tertulia

networks:
  tertulia:
    driver: bridge
