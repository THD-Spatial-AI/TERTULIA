# Development overrides — mounts source for live reload.
# Usage: make dev-docker
services:

  backend:
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    environment:
      - LOG_LEVEL=DEBUG
      - ENABLE_DOCS=true

  frontend-dev:
    image: node:20-alpine
    container_name: tertulia-frontend-dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env.local
    environment:
      - VITE_BACKEND_URL=
      - VITE_AUTH_SERVICE_URL=http://localhost:8002
      - VITE_AUTH_REALM=tertulia
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - tertulia

networks:
  tertulia:
    driver: bridge
